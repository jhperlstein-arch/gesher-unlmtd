<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gesher — Israeli Real Estate Advisory for American Buyers</title>
  <meta name="description" content="Gesher helps American buyers understand the Israeli property market, plan a purchase around their goals, and work with vetted, independent Israeli legal, tax and mortgage professionals." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0d1b2a;
      --navy-2: #15283d;
      --ink: #1c2530;
      --muted: #5b6673;
      --line: #e3ddd0;
      --cream: #faf7f1;
      --paper: #ffffff;
      --gold: #b8924a;
      --gold-2: #d4b47a;
      --ok: #2f7a4f;
      --err: #a33a3a;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: #eef1f5; color: var(--ink);
      font: 16px/1.65 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }
    h1, h2, h3 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; line-height: 1.15; margin: 0; }
    a { color: inherit; }
    button { font: inherit; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
    .eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 12px; font-weight: 600; color: var(--gold); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* Nav */
    nav { position: sticky; top: 0; z-index: 10; background: rgba(13,27,42,.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,.06); }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-family: "Cormorant Garamond", serif; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
    .brand-mark { width: 30px; height: 30px; }
    .nav-links { display: flex; gap: 26px; align-items: center; }
    .nav-links a { color: #c9d1db; text-decoration: none; font-size: 14px; }
    .nav-links a:hover { color: #fff; }
    .btn { display: inline-block; border: 0; cursor: pointer; text-decoration: none; font: 600 14px/1 Inter, sans-serif; letter-spacing: .03em; padding: 14px 22px; border-radius: 2px; transition: background .2s, color .2s, border-color .2s, transform .1s; }
    .btn:active { transform: translateY(1px); }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-gold:hover { background: #a37f3c; }
    .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); }
    .btn-ghost:hover { border-color: #fff; }
    .btn-line { background: transparent; color: var(--navy); border: 1px solid var(--navy); }
    .btn-line:hover { background: var(--navy); color: #fff; }
    .nav-links .btn { padding: 10px 16px; color: #fff; }

    /* Hero */
    .hero { background: radial-gradient(1200px 600px at 80% -10%, #1f3a57 0%, transparent 60%), linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; padding: 110px 0 120px; position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; right: -120px; bottom: -120px; width: 480px; height: 480px; border: 1px solid rgba(212,180,122,.18); border-radius: 50%; }
    .hero h1 { font-size: clamp(40px, 6vw, 68px); max-width: 860px; margin: 18px 0 22px; }
    .hero h1 em { color: var(--gold-2); font-style: italic; }
    .hero p.lead { font-size: 19px; color: #c9d1db; max-width: 660px; margin: 0 0 36px; }
    .ctas { display: flex; gap: 14px; flex-wrap: wrap; }
    .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 72px; max-width: 760px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 28px; }
    .hero-stats strong { display: block; font-family: "Cormorant Garamond", serif; font-size: 28px; color: var(--gold-2); font-weight: 600; }
    .hero-stats span { font-size: 13px; color: #9fabb8; }

    /* Sections */
    section { padding: 100px 0; scroll-margin-top: 68px; }
    .section-head { max-width: 680px; margin-bottom: 56px; }
    .section-head h2 { font-size: clamp(32px, 4vw, 46px); margin: 12px 0 16px; }
    .section-head p { color: var(--muted); font-size: 17px; margin: 0; }
    .cream { background: var(--cream); }

    /* Paths (persona tabs) */
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 0; }
    .tab { text-align: left; background: var(--paper); border: 1px solid var(--line); border-bottom: 0; padding: 22px 24px; cursor: pointer; color: var(--muted); transition: background .2s, color .2s; position: relative; }
    .tab .tnum { font-family: "Cormorant Garamond", serif; color: var(--gold); font-size: 18px; font-weight: 600; display: block; }
    .tab .tlabel { font-family: "Cormorant Garamond", serif; font-size: 22px; font-weight: 600; color: var(--ink); line-height: 1.2; }
    .tab:hover { background: #fdfbf7; }
    .tab[aria-selected="true"] { background: var(--navy); color: #c9d1db; border-color: var(--navy); }
    .tab[aria-selected="true"] .tlabel { color: #fff; }
    .tab[aria-selected="true"] .tnum { color: var(--gold-2); }
    .panel { background: var(--navy); color: #fff; padding: 48px; display: grid; grid-template-columns: 7fr 5fr; gap: 48px; }
    .panel blockquote { margin: 0; font-family: "Cormorant Garamond", serif; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.2; color: #fff; }
    .panel blockquote::before { content: ""; display: block; width: 40px; height: 1px; background: var(--gold-2); margin-bottom: 22px; }
    .panel p { color: #c9d1db; margin: 22px 0 28px; }
    .panel ul { list-style: none; margin: 0; padding: 0; }
    .panel li { padding: 13px 0 13px 26px; border-bottom: 1px solid rgba(255,255,255,.1); position: relative; font-size: 15px; color: #dfe5ec; }
    .panel li::before { content: ""; position: absolute; left: 0; top: 24px; width: 12px; height: 1px; background: var(--gold-2); }
    .panel .eyebrow { color: var(--gold-2); margin-bottom: 8px; }

    /* Approach compare */
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
    .compare { background: var(--paper); border: 1px solid var(--line); padding: 36px; }
    .compare-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .compare-row:last-child { border-bottom: 0; }
    .compare-row.head { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 600; color: var(--muted); padding-top: 0; }
    .compare-row .us { color: var(--navy); font-weight: 500; }
    .compare-row .them { color: #8a939d; }

    .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .pillar { background: var(--paper); padding: 36px 28px; }
    .pillar .num { font-family: "Cormorant Garamond", serif; color: var(--gold); font-size: 20px; font-weight: 600; }
    .pillar h3 { font-size: 24px; margin: 14px 0 10px; }
    .pillar p { color: var(--muted); font-size: 15px; margin: 0; }

    /* Budget explorer */
    .pills { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--navy); margin-bottom: 32px; }
    .pill { background: transparent; border: 0; border-right: 1px solid var(--navy); padding: 14px 26px; cursor: pointer; font-family: "Cormorant Garamond", serif; font-size: 22px; font-weight: 600; color: var(--navy); transition: background .2s, color .2s; }
    .pill:last-child { border-right: 0; }
    .pill:hover { background: #f2ece0; }
    .pill[aria-pressed="true"] { background: var(--navy); color: var(--gold-2); }
    .budget-card { background: var(--paper); border: 1px solid var(--line); box-shadow: 0 30px 60px -30px rgba(13,27,42,.2); }
    .budget-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 22px 36px; border-bottom: 1px solid var(--line); }
    .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold-2); padding: 6px 10px; }
    .budget-top h3 { font-size: 28px; }
    .budget-body { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--line); }
    .budget-body > div { background: var(--paper); padding: 28px 36px; }
    .budget-body h4 { margin: 0 0 12px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .budget-body ul { margin: 0; padding: 0; list-style: none; }
    .budget-body li { padding: 7px 0; font-size: 15px; border-bottom: 1px dashed var(--line); }
    .budget-body li:last-child { border-bottom: 0; }
    .budget-body li strong { display: block; color: var(--navy); font-weight: 600; }
    .budget-body li span { color: var(--muted); font-size: 13px; }
    .budget-foot { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; padding: 22px 36px; border-top: 1px solid var(--line); background: var(--cream); }
    .budget-foot p { margin: 0; font-size: 13px; color: var(--muted); max-width: 640px; }

    /* Journey (dark) */
    .dark { background: var(--navy); color: #fff; }
    .dark .section-head p { color: #9fabb8; }
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 32px; counter-reset: step; }
    .step { border-top: 1px solid rgba(212,180,122,.4); padding-top: 24px; }
    .step::before { counter-increment: step; content: "0" counter(step); font-family: "Cormorant Garamond", serif; font-size: 40px; color: var(--gold-2); display: block; line-height: 1; margin-bottom: 14px; }
    .step h3 { font-size: 22px; margin-bottom: 8px; }
    .step p { color: #9fabb8; font-size: 15px; margin: 0; }

    /* FAQ */
    .guide-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
    .cats { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat { background: var(--paper); border: 1px solid var(--line); padding: 9px 14px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-radius: 2px; }
    .cat:hover { border-color: var(--gold); color: var(--ink); }
    .cat[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
    .search { position: relative; flex: 0 1 300px; }
    .search input { width: 100%; font: inherit; font-size: 14px; padding: 10px 14px; border: 1px solid var(--line); background: var(--paper); border-radius: 2px; outline: none; }
    .search input:focus { border-color: var(--gold); }
    .faq-group { margin-bottom: 36px; }
    .faq-group h3 { font-size: 24px; margin-bottom: 12px; display: flex; gap: 12px; align-items: baseline; }
    .faq-group h3 small { font-family: Inter, sans-serif; font-size: 12px; letter-spacing: .14em; color: var(--gold); font-weight: 600; }
    .faq { background: var(--paper); border: 1px solid var(--line); }
    .qa + .qa { border-top: 1px solid var(--line); }
    .qa > button { width: 100%; display: flex; justify-content: space-between; gap: 20px; align-items: center; text-align: left; background: none; border: 0; padding: 20px 26px; cursor: pointer; font-size: 16px; font-weight: 500; color: var(--ink); }
    .qa > button:hover { color: var(--navy); background: #fdfbf7; }
    .qa > button .qn { color: var(--gold); font-family: "Cormorant Garamond", serif; font-size: 18px; font-weight: 600; margin-right: 12px; }
    .qa .chev { flex: none; width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 50%; position: relative; transition: transform .2s; }
    .qa .chev::before, .qa .chev::after { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 1px; background: var(--ink); transform: translate(-50%,-50%); }
    .qa .chev::after { transform: translate(-50%,-50%) rotate(90deg); transition: transform .2s; }
    .qa.open .chev::after { transform: translate(-50%,-50%) rotate(0deg); }
    .answer { padding: 0 26px 24px 56px; color: #3b4652; font-size: 15px; max-width: 860px; }
    .answer p { margin: 0 0 12px; }
    .answer ul { margin: 0 0 12px; padding-left: 18px; }
    .answer li { margin-bottom: 6px; }
    .answer ol.mini { list-style: none; padding: 0; margin: 8px 0 12px; counter-reset: mini; }
    .answer ol.mini li { counter-increment: mini; position: relative; padding: 0 0 14px 38px; margin: 0; border-left: 1px solid var(--line); margin-left: 12px; }
    .answer ol.mini li:last-child { border-left-color: transparent; padding-bottom: 0; }
    .answer ol.mini li::before { content: counter(mini); position: absolute; left: -12px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: var(--gold-2); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
    .answer ol.mini strong { color: var(--navy); }
    .empty { padding: 28px; color: var(--muted); background: var(--paper); border: 1px solid var(--line); }
    mark { background: #f3e6c8; color: inherit; padding: 0 1px; }

    /* Brief form */
    .apply { background: linear-gradient(180deg, var(--cream) 0%, #f2ece0 100%); }
    .apply-grid { display: grid; grid-template-columns: 5fr 7fr; gap: 64px; align-items: start; }
    .apply-copy ul { list-style: none; padding: 0; margin: 28px 0 0; }
    .apply-copy li { padding: 12px 0 12px 28px; border-bottom: 1px solid var(--line); position: relative; font-size: 15px; }
    .apply-copy li::before { content: ""; position: absolute; left: 0; top: 21px; width: 12px; height: 1px; background: var(--gold); }
    .card { background: var(--paper); border: 1px solid var(--line); padding: 40px; box-shadow: 0 30px 60px -30px rgba(13,27,42,.25); }
    .progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .progress span { height: 3px; background: var(--line); transition: background .3s; }
    .progress span.on { background: var(--gold); }
    .step-label { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 26px; }
    .step-label b { color: var(--navy); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .field > label, .field > .flabel { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .field .opt { text-transform: none; letter-spacing: 0; font-weight: 400; }
    .field input, .field select, .field textarea {
      font: inherit; font-size: 15px; color: var(--ink); background: var(--cream);
      border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px; outline: none; transition: border-color .15s, background .15s;
    }
    .field input:focus, .field select:focus { border-color: var(--gold); background: #fff; }
    .field .bad { border-color: var(--err); }
    .ferr { color: var(--err); font-size: 13px; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choices.three { grid-template-columns: repeat(3, 1fr); }
    .choices.five { grid-template-columns: repeat(5, 1fr); }
    .choice { background: var(--cream); border: 1px solid var(--line); border-radius: 2px; padding: 13px 14px; font-size: 14px; text-align: left; cursor: pointer; color: var(--ink); transition: border-color .15s, background .15s; }
    .choices.five .choice { text-align: center; padding: 13px 6px; }
    .choice:hover { border-color: var(--gold-2); }
    .choice[aria-pressed="true"], .choice[aria-checked="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
    .choice small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .choice[aria-checked="true"] small { color: #9fabb8; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: var(--cream); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; color: var(--ink); }
    .chip:hover { border-color: var(--gold-2); }
    .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); margin: 4px 0 6px; }
    .check input { margin-top: 4px; accent-color: var(--gold); }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .form-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
    .form-nav .btn-gold { flex: 1; padding: 16px; font-size: 15px; }
    .form-nav .btn-line { padding: 16px 22px; }
    .btn[disabled] { opacity: .6; cursor: wait; }
    .status { margin-top: 16px; font-size: 14px; padding: 12px 14px; border-left: 3px solid; }
    .status.err { color: var(--err); border-color: var(--err); background: #f9eeee; }
    .success { text-align: center; padding: 30px 10px; }
    .success h3 { font-size: 32px; margin: 10px 0; }
    .success p { color: var(--muted); }

    /* Consult CTA */
    .consult { background: radial-gradient(900px 500px at 10% 120%, #1f3a57 0%, transparent 60%), var(--navy); color: #fff; text-align: center; }
    .consult h2 { font-size: clamp(32px, 4.4vw, 50px); max-width: 820px; margin: 14px auto 18px; }
    .consult p { color: #c9d1db; max-width: 620px; margin: 0 auto 34px; font-size: 17px; }
    .consult .ctas { justify-content: center; }
    .consult .fine { font-size: 13px; color: #8995a3; margin: 22px auto 0; }

    /* Modal */
    .backdrop { position: fixed; inset: 0; background: rgba(13,27,42,.7); z-index: 50; display: grid; place-items: center; padding: 16px; }
    .modal { background: var(--paper); width: min(760px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; border-top: 3px solid var(--gold); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--line); }
    .modal-head h3 { font-size: 24px; }
    .x { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; }
    .modal iframe { width: 100%; height: min(680px, calc(100vh - 120px)); border: 0; }

    footer { background: var(--navy); color: #8995a3; font-size: 13px; padding: 48px 0; border-top: 1px solid rgba(255,255,255,.06); }
    footer .wrap { display: flex; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
    footer .disclaimer { max-width: 660px; line-height: 1.6; margin: 0; }

    @media (max-width: 900px) {
      .split, .apply-grid, .panel { grid-template-columns: 1fr; gap: 40px; }
      .pillars, .steps { grid-template-columns: 1fr 1fr; }
      .budget-body { grid-template-columns: 1fr; }
      .nav-links a:not(.btn) { display: none; }
      .panel { padding: 36px; }
    }
    @media (max-width: 680px) {
      .tabs { grid-template-columns: 1fr; gap: 0; }
      .tab { border-bottom: 1px solid var(--line); padding: 16px 20px; }
      .choices.five { grid-template-columns: repeat(3, 1fr); }
      .pills { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
      .pill { border-right: 0; border-bottom: 1px solid var(--navy); padding: 12px; }
      .pill:nth-child(odd) { border-right: 1px solid var(--navy); }
      .pill:nth-last-child(-n+2) { border-bottom: 0; }
    }
    @media (max-width: 560px) {
      .wrap { padding: 0 16px; }
      section { padding: 72px 0; }
      .hero { padding: 72px 0 80px; }
      .pillars, .steps, .row, .choices, .choices.three { grid-template-columns: 1fr; }
      .hero-stats { grid-template-columns: 1fr; gap: 16px; }
      .card, .compare { padding: 24px; }
      .panel { padding: 28px 22px; }
      .budget-top, .budget-body > div, .budget-foot { padding-left: 22px; padding-right: 22px; }
      .compare-row { font-size: 14px; }
      .qa > button { padding: 18px 18px; }
      .answer { padding: 0 18px 20px 18px; }
      .search { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + htm (JSX-like templates, no build step needed) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>

  <script>
    // ============================================================
    // CONFIG
    // Lead capture: the Property Brief posts to /api/leads (Google Sheets — see SETUP_SHEETS.md).
    // Web3Forms is also sent as a best-effort email notification; set to "" to disable.
    const WEB3FORMS_ACCESS_KEY = "6aa2bf1f-1780-4253-9716-a97f5f8647a4";
    const LEADS_ENDPOINT = "/api/leads";
    // Booking link for "Schedule an introductory call" (e.g. a Calendly / Cal.com / Google
    // appointment page). Leave "" to send visitors to the Property Brief form instead.
    const BOOKING_URL = "";
    // ============================================================

    const { useState, useEffect, useMemo, useRef } = React;
    const html = htm.bind(React.createElement);

    // ---------- Shared option lists (keep in sync with api/leads.js) ----------
    const OBJECTIVES = [
      ["Investment", "Capital allocation & income"],
      ["Second home", "Holidays, family, belonging"],
      ["Future Aliyah or relocation", "Retirement or moving later"],
      ["Exploring", "Still figuring it out"],
    ];
    const BUDGETS = ["$250k", "$400k", "$600k", "$1M+", "Custom"];
    const LOCATIONS = ["Jerusalem", "Tel Aviv", "Herzliya", "Ra'anana", "Netanya", "Modi'in", "Beit Shemesh", "Haifa", "Not sure yet"];
    const TIMELINES = ["Within 6 months", "6–12 months", "12+ months"];

                    ${items.map((f) => html`
                      <${QA} key=${f.n} item=${f} n=${f.n} q=${term}
                        open=${open === f.n || (!!term && matches.length <= 3)}
                        onToggle=${() => setOpen(open === f.n ? 0 : f.n)} />`)}
                  </div>
                </div>`;
            })}
          </div>
        </section>`;
    }

    // ---------- Israel Property Brief (multi-step lead form) ----------
    const EMPTY_BRIEF = {
      name: "", email: "", phone: "",
      objective: "", budget: "", budgetCustom: "",
      locations: [], otherLocation: "", timeline: "", fromUS: "",
      consent: false, company: "",
    };

    function validateStep(step, f) {
      const e = {};
      if (step === 0) {
        if (f.name.trim().length < 2) e.name = "Please enter your full name.";
        if (!EMAIL_RE.test(f.email.trim())) e.email = "Please enter a valid email address.";
        if (f.phone.trim() && !/^[+()\d\s.\-]{7,25}$/.test(f.phone.trim())) e.phone = "Please enter a valid phone number, or leave it blank.";
      }
      if (step === 1) {
        if (!f.objective) e.objective = "Please choose your primary objective.";
        if (!f.budget) e.budget = "Please choose an approximate budget.";
        if (f.budget === "Custom" && !f.budgetCustom.trim()) e.budgetCustom = "Please describe your budget.";
      }
      if (step === 2) {
        if (!f.locations.length && !f.otherLocation.trim()) e.locations = "Choose at least one location, or “Not sure yet”.";
        if (!f.timeline) e.timeline = "Please choose a timeline.";
        if (!f.fromUS) e.fromUS = "Please let us know.";
        if (!f.consent) e.consent = "Please confirm so we can contact you.";
      }
      return e;
    }

    function Choice({ group, value, current, onPick, children }) {
      return html`
        <button type="button" className="choice" role="radio" aria-checked=${current === value}
          onClick=${() => onPick(value)} data-group=${group}>${children || value}</button>`;
    }

    function BriefForm({ prefill }) {
      const [f, setF] = useState(EMPTY_BRIEF);
      const [step, setStep] = useState(0);
      const [errs, setErrs] = useState({});
      const [status, setStatus] = useState("idle"); // idle | sending | done | error
      const [msg, setMsg] = useState("");
      const topRef = useRef(null);

      useEffect(() => {
        if (!prefill.n) return;
        setF((x) => ({ ...x, ...(prefill.objective ? { objective: prefill.objective } : {}), ...(prefill.budget ? { budget: prefill.budget } : {}) }));
        if (status === "done") setStatus("idle");
      }, [prefill.n]);

      const set = (k, v) => { setF((x) => ({ ...x, [k]: v })); setErrs((x) => ({ ...x, [k]: undefined })); };
      const toggleLoc = (loc) => {
        const has = f.locations.includes(loc);
        let next = has ? f.locations.filter((l) => l !== loc) : [...f.locations, loc];
        if (!has && loc === "Not sure yet") next = ["Not sure yet"];
        else if (!has) next = next.filter((l) => l !== "Not sure yet");
        set("locations", next);
      };

      const go = (to) => { setStep(to); topRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" }); };
      const next = () => {
        const e = validateStep(step, f);
        setErrs(e);
        if (Object.keys(e).length === 0) go(step + 1);
      };

      async function submit(ev) {
        ev.preventDefault();
        if (step < 2) return next();
        const e = validateStep(2, f);
        setErrs(e);
        if (Object.keys(e).length) return;
        if (f.company) { setStatus("done"); return; } // honeypot

        const locations = [...f.locations, ...(f.otherLocation.trim() ? [f.otherLocation.trim()] : [])];
        const payload = {
          name: f.name.trim(), email: f.email.trim(), phone: f.phone.trim(),
          objective: f.objective, budget: f.budget, budgetCustom: f.budgetCustom.trim(),
          locations, timeline: f.timeline, fromUS: f.fromUS, consent: f.consent, company: f.company,
        };
        setStatus("sending"); setMsg("");

        const sheet = fetch(LEADS_ENDPOINT, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        }).then(async (r) => {
          const data = await r.json().catch(() => ({}));
          if (!r.ok || !data.ok) { const err = new Error(data.error || "Lead service error"); err.fields = data.fields; err.status = r.status; throw err; }
          return data;
        });

        const email = WEB3FORMS_ACCESS_KEY ? fetch("https://api.web3forms.com/submit", {
          method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            access_key: WEB3FORMS_ACCESS_KEY,
            subject: `New Israel Property Brief — ${payload.name} (${payload.objective}, ${payload.budget === "Custom" ? payload.budgetCustom : payload.budget})`,
            from_name: "Gesher Website",
            name: payload.name, email: payload.email, phone: payload.phone || "—",
            objective: payload.objective,
            budget: payload.budget === "Custom" ? "Custom: " + payload.budgetCustom : payload.budget,
            locations: locations.join(", "), timeline: payload.timeline, purchasing_from_us: payload.fromUS,
            botcheck: false,
          }),
        }).then((r) => r.json()).then((d) => { if (!d.success) throw new Error(d.message); return d; }) : Promise.reject(new Error("disabled"));

        const [s, m] = await Promise.allSettled([sheet, email]);
        if (s.status === "rejected" && s.reason.status === 400) {
          setStatus("error");
          setMsg(s.reason.message || "Please check your answers and try again.");
          if (s.reason.fields) setErrs(s.reason.fields);
          return;
        }
        if (s.status === "fulfilled" || m.status === "fulfilled") {
          setStatus("done"); setF(EMPTY_BRIEF); setStep(0); setErrs({});
        } else {
          setStatus("error");
          setMsg("We couldn't send your brief. Please check your connection and try again.");
        }
      }

      if (status === "done") {
        return html`
          <div className="card" ref=${topRef}>
            <div className="success">
              <div className="eyebrow">Brief Received</div>
              <h3>Thank you.</h3>
              <p>A member of our team will review your brief and reach out personally within a few business days to explore your options.</p>
              <button className="btn btn-gold" style=${{ marginTop: 12 }} onClick=${() => setStatus("idle")}>Submit another brief</button>
            </div>
          </div>`;
      }

      const E = (k) => errs[k] && html`<span className="ferr" role="alert">${errs[k]}</span>`;
      const labels = ["About you", "Your goals", "Location & timing"];

      return html`
        <form className="card" onSubmit=${submit} noValidate ref=${topRef}>
          <div className="hp" aria-hidden="true">
            <label>Company<input tabIndex="-1" autoComplete="off" value=${f.company} onChange=${(e) => set("company", e.target.value)} /></label>
          </div>
          <div className="progress" aria-hidden="true">${labels.map((_, k) => html`<span key=${k} className=${k <= step ? "on" : ""}></span>`)}</div>
          <div className="step-label">Step ${step + 1} of 3 · <b>${labels[step]}</b></div>

          ${step === 0 && html`
            <div>
              <div className="field"><label htmlFor="b-name">Full name</label>
                <input id="b-name" className=${errs.name ? "bad" : ""} value=${f.name} onChange=${(e) => set("name", e.target.value)} autoComplete="name" />${E("name")}</div>
              <div className="row">
                <div className="field"><label htmlFor="b-email">Email</label>
                  <input id="b-email" type="email" className=${errs.email ? "bad" : ""} value=${f.email} onChange=${(e) => set("email", e.target.value)} autoComplete="email" />${E("email")}</div>
                <div className="field"><label htmlFor="b-phone">Phone / WhatsApp <span className="opt">(optional)</span></label>
                  <input id="b-phone" type="tel" className=${errs.phone ? "bad" : ""} value=${f.phone} onChange=${(e) => set("phone", e.target.value)} autoComplete="tel" placeholder="+1 …" />${E("phone")}</div>
              </div>
            </div>`}

          ${step === 1 && html`
            <div>
              <div className="field"><span className="flabel" id="lbl-obj">Primary objective</span>
                <div className="choices" role="radiogroup" aria-labelledby="lbl-obj">
                  ${OBJECTIVES.map(([v, d]) => html`<${Choice} key=${v} group="objective" value=${v} current=${f.objective} onPick=${(x) => set("objective", x)}>${v}<small>${d}</small><//>`)}
                </div>${E("objective")}</div>
              <div className="field"><span className="flabel" id="lbl-bud">Approximate budget</span>
                <div className="choices five" role="radiogroup" aria-labelledby="lbl-bud">
                  ${BUDGETS.map((v) => html`<${Choice} key=${v} group="budget" value=${v} current=${f.budget} onPick=${(x) => set("budget", x)} />`)}
                </div>${E("budget")}</div>
              ${f.budget === "Custom" && html`
                <div className="field"><label htmlFor="b-bc">Describe your budget</label>
                  <input id="b-bc" className=${errs.budgetCustom ? "bad" : ""} value=${f.budgetCustom} maxLength="60" onChange=${(e) => set("budgetCustom", e.target.value)} placeholder="e.g. $750k–$850k, or ₪3M" />${E("budgetCustom")}</div>`}
            </div>`}

          ${step === 2 && html`
            <div>
              <div className="field"><span className="flabel" id="lbl-loc">Preferred locations <span className="opt">(choose any)</span></span>
                <div className="chips" role="group" aria-labelledby="lbl-loc">
                  ${LOCATIONS.map((l) => html`<button type="button" key=${l} className="chip" aria-pressed=${f.locations.includes(l)} onClick=${() => toggleLoc(l)}>${l}</button>`)}
                </div>
                <input aria-label="Other locations" style=${{ marginTop: 6 }} value=${f.otherLocation} maxLength="120" onChange=${(e) => set("otherLocation", e.target.value)} placeholder="Other places you're considering (optional)" />
                ${E("locations")}</div>
              <div className="field"><span className="flabel" id="lbl-time">Target timeline</span>
                <div className="choices three" role="radiogroup" aria-labelledby="lbl-time">
                  ${TIMELINES.map((v) => html`<${Choice} key=${v} group="timeline" value=${v} current=${f.timeline} onPick=${(x) => set("timeline", x)} />`)}
                </div>${E("timeline")}</div>
              <div className="field"><span className="flabel" id="lbl-us">Purchasing from the US?</span>
                <div className="choices" role="radiogroup" aria-labelledby="lbl-us">
                  ${["Yes", "No"].map((v) => html`<${Choice} key=${v} group="fromUS" value=${v} current=${f.fromUS} onPick=${(x) => set("fromUS", x)} />`)}
                </div>${E("fromUS")}</div>
              <label className="check">
                <input type="checkbox" checked=${f.consent} onChange=${(e) => set("consent", e.target.checked)} />
                <span>I agree to be contacted by Gesher about my enquiry. I understand Gesher provides general guidance and that legal, tax and mortgage advice comes from independent licensed professionals.</span>
              </label>${E("consent")}
            </div>`}

          <div className="form-nav">
            ${step > 0 && html`<button type="button" className="btn btn-line" onClick=${() => go(step - 1)}>Back</button>`}
            <button className="btn btn-gold" type="submit" disabled=${status === "sending"}>
              ${step < 2 ? "Continue" : status === "sending" ? "Sending…" : "Send my Property Brief"}
            </button>
          </div>
          ${status === "error" && html`<div className="status err" role="alert">${msg}</div>`}
        </form>`;
    }

    function Brief({ prefill }) {
      return html`
        <section className="apply" id="brief">
          <div className="wrap apply-grid">
            <div className="apply-copy">
              <div className="eyebrow">Your Israel Property Brief</div>
              <div className="section-head" style=${{ marginBottom: 0 }}>
                <h2>Not sure where to start? Let's identify your options.</h2>
                <p>Tell us what you are looking for, and our team will help you explore relevant Israeli locations, property types and purchasing approaches.</p>
              </div>
              <ul>
                <li>Takes about two minutes — no obligation</li>
                <li>A personal follow-up, not an automated sales sequence</li>
                <li>Locations and property types matched to your goals</li>
                <li>Introductions to independent legal, tax and mortgage professionals</li>
              </ul>
            </div>
            <${BriefForm} prefill=${prefill} />
          </div>
        </section>`;
    }

    function Consult({ onBook }) {
      return html`
        <section className="consult" id="consult">
          <div className="wrap">
            <div className="eyebrow">Private Introductory Consultation</div>
            <h2>Let's explore what Israeli real estate could look like for you.</h2>
            <p>Whether you are considering an investment, a second home or a future residence in Israel, start with a conversation about your objectives.</p>
            <div className="ctas">
              <button className="btn btn-gold" onClick=${onBook}>Schedule an introductory call</button>
            </div>
            <p className="fine">No obligation. We'll focus on your goals — not on selling you a property.</p>
          </div>
        </section>`;
    }

    function BookingModal({ onClose }) {
      const closeRef = useRef(null);
      useEffect(() => {
        document.body.classList.add("modal-open");
        closeRef.current?.focus();
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", onKey);
        return () => { document.body.classList.remove("modal-open"); window.removeEventListener("keydown", onKey); };
      }, []);
      return html`
        <div className="backdrop" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby="book-title">
            <div className="modal-head">
              <h3 id="book-title">Schedule an introductory call</h3>
              <button className="x" ref=${closeRef} onClick=${onClose} aria-label="Close">×</button>
            </div>
            <iframe src=${BOOKING_URL} title="Booking calendar" loading="lazy"></iframe>
          </div>
        </div>`;
    }

    function Footer() {
      return html`
        <footer>
          <div className="wrap">
            <div>
              <a className="brand" href="#top"><${BrandMark} /> Gesher</a>
              <div style=${{ marginTop: 10 }}>© ${new Date().getFullYear()} Gesher</div>
            </div>
            <p className="disclaimer">The information on this website is general and educational. It is not legal, tax, mortgage or investment advice, and it does not constitute an offer or solicitation. Gesher does not guarantee property appreciation, rental income or any financial outcome. Budget examples are illustrative market overviews, not listings or available inventory. Always consult independent, licensed professionals in Israel and the United States before making a purchase decision.</p>
          </div>
        </footer>`;
    }

    function App() {
      const [prefill, setPrefill] = useState({ n: 0 });
      const [booking, setBooking] = useState(false);
      const startBrief = (patch) => { setPrefill((p) => ({ ...patch, n: p.n + 1 })); scrollTo("brief"); };
      const onBook = () => (BOOKING_URL ? setBooking(true) : scrollTo("brief"));
      return html`
        <${Nav} />
        <${Hero} onBook=${onBook} />
        <${Paths} onStart=${startBrief} />
        <${Approach} />
        <${Pillars} />
        <${BudgetExplorer} onStart=${startBrief} />
        <${Process} />
        <${Guide} />
        <${Brief} prefill=${prefill} />
        <${Consult} onBook=${onBook} />
        <${Footer} />
        ${booking && html`<${BookingModal} onClose=${() => setBooking(false)} />`}`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
